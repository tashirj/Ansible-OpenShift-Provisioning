# Openshift Settings
install_config_defaults:
  api_version: v1
  compute:
    architecture: s390x
    hyperthreading: Enabled
  control:
    architecture: s390x
    hyperthreading: Enabled
  cluster_network:
    cidr: 10.128.0.0/14
    host_prefix: 23
    type: OVNKubernetes
  service_network: 172.30.0.0/16
  machine_network: 192.168.122.0/24
  fips: false

rhcos_os_variant: rhl9

# Timeout in seconds for node creation via virt-install.
# A RHEL9 kickstart install over HTTP on s390x KVM typically takes 15-30 min.
# 3600 = 60 min — gives headroom for slow file-server or heavily loaded LPAR.
timeout_node_creation: 3600